name: AI (FastAPI) CI/CD

permissions:
  contents: write
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [develop, main]

jobs:
  # =========================================================
  # CI Job: 코드 검사, 테스트, 소스 코드 압축(Artifact 생성)
  # =========================================================
  ci:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Python 환경 설정 (3.11)
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 3. uv 설치
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # 4. 의존성 설치 (CI용 - uv.lock 기반)
      - name: Install Dependencies
        run: |
          uv sync --frozen --no-dev
          # 필요한 툴 설치
          uv pip install --system ruff pytest httpx

      # Phase 1: Lint (Ruff)
      # - name: Run Linter (Ruff)
      #   run: ruff check . --fix
      #   continue-on-error: true # 초기엔 경고만 (점진적 개선)

      # Phase 2: Test (TODO: 테스트 작성 후 활성화)
      # - name: Run Tests
      #   run: pytest

      # Phase 3: Artifact Build (소스 코드 압축)
      # .git, __pycache__, .venv 등 불필요한 파일 제외
      - name: Zip Source Code
        run: |
          mkdir build
          zip -r build/ai-app.zip . -x "*.git*" ".github*" ".venv*" "__pycache__*" "tests*" "notebooks*"

      # Phase 4: Artifact Upload
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-app-${{ github.sha }}
          path: build/ai-app.zip
          retention-days: 14

      #  현재 시간 구하기 (KST)
      - name: Get Current Time
        uses: 1466587594/get-current-time@v2
        id: current-time
        with:
          format: 'YYYY-MM-DD HH:mm:ss'
          utcOffset: "+09:00" # 한국 시간
          timezone: 'Asia/Seoul'

      # Phase 5: Discord 성공 알림
      - name: Discord Notification - Success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "✅ AI CI 성공",
              "color": 5763719,
              "fields": [
                {"name": "Repository", "value": "${{ github.repository }}", "inline": false},
                {"name": "Merge To", "value": "${{ github.base_ref }}", "inline": false},
                {"name": "Triggered By", "value": "${{ github.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ github.event.pull_request.title }}", "inline": false},
                {"name": "Actions Log", "value": "[Link to Action](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: 'CI 파이프라인이 성공적으로 완료되었습니다. <@&${{ secrets.DISCORD_ROLE_AI }}>'

      # Phase 5: Discord 실패 알림
      - name: Discord Notification - Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "🚨 AI CI 실패",
              "color": 15548997,
              "fields": [
                {"name": "Repository", "value": "${{ github.repository }}", "inline": false},
                {"name": "Merge To", "value": "${{ github.base_ref }}", "inline": false},
                {"name": "Triggered By", "value": "${{ github.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ github.event.pull_request.title }}", "inline": false},
                {"name": "Actions Log", "value": "[Link to Action](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: 'CI 파이프라인 실행 중 오류가 발생했습니다. 로그를 확인해주세요. <@&${{ secrets.DISCORD_ROLE_AI_ONCALL }}>'
 
  # Dev 환경 배포 (develop 브랜치 merge 시)
  deploy-dev:
    if: github.event.pull_request.merged == true && github.base_ref == 'develop'
    uses: ./.github/workflows/ai-deploy-template.yml
    with:
      environment: dev
      pr_number: ${{ github.event.pull_request.number }}
      commit_sha: ${{ github.sha }}
      base_ref: ${{ github.base_ref }}
      pr_title: ${{ github.event.pull_request.title }}
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      run_id: ${{ github.run_id }}
      create_tag: false
    secrets: inherit

  # Staging 환경 배포 (main 브랜치 merge 시, 자동)
  deploy-staging:
    if: github.event.pull_request.merged == true && github.base_ref == 'main'
    uses: ./.github/workflows/ai-deploy-template.yml
    with:
      environment: staging
      pr_number: ${{ github.event.pull_request.number }}
      commit_sha: ${{ github.sha }}
      base_ref: ${{ github.base_ref }}
      pr_title: ${{ github.event.pull_request.title }}
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      run_id: ${{ github.run_id }}
      create_tag: false
    secrets: inherit

  # Production 환경 배포 (Staging 성공 후 수동 승인 필요)
  deploy-production:
    if: github.event.pull_request.merged == true && github.base_ref == 'main'
    needs: [deploy-staging]
    uses: ./.github/workflows/ai-deploy-template.yml
    with:
      environment: production # GitHub Environment에서 Required reviewers 설정 필수
      pr_number: ${{ github.event.pull_request.number }}
      commit_sha: ${{ github.sha }}
      base_ref: ${{ github.base_ref }}
      pr_title: ${{ github.event.pull_request.title }}
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      run_id: ${{ github.run_id }}
      create_tag: true # Production만 시맨틱 버전 태그 생성
    secrets: inherit
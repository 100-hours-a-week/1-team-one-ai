name: Deploy AI ASG via Rolling Update

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: '배포 환경 (staging / production)'
      image_uri:
        required: true
        type: string
        description: '배포할 Docker 이미지 URI'
      asg_name:
        required: true
        type: string
        description: 'Auto Scaling Group 이름'
      lt_id:
        required: true
        type: string
        description: 'Launch Template ID'
      pr_number:
        required: true
        type: string
      pr_title:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      run_id:
        required: true
        type: string

    secrets:
      DISCORD_WEBHOOK_URL:
        required: true
      DISCORD_ROLE_AI:
        required: true
      DISCORD_ROLE_AI_ONCALL:
        required: true
      AWS_ROLE_ARN:
        required: true
      STG_ALB_DNS:
        required: true
      PROD_ALB_DNS:
        required: true

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy-asg:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. 시멘틱 버전 태그 생성
      - name: Create Semantic Version Tag
        if: inputs.environment == 'production'
        id: create_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Calculating next version..."
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*.*.*" 2>/dev/null || echo "v0.0.0")
          echo "Current Latest Tag: $LATEST_TAG"
          
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "New Version to be created: $NEW_VERSION"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a $NEW_VERSION -m "Production Release $NEW_VERSION
          PR: #${{ inputs.pr_number }} - ${{ inputs.pr_title }}
          Commit: ${{ github.sha }}
          Actor: ${{ inputs.actor }}"
          
          git push origin $NEW_VERSION
          
          echo "DEPLOY_TAG=$NEW_VERSION" >> $GITHUB_ENV
          echo "Tag created: $NEW_VERSION"

      # 2. ECR 이미지에 새 태그 붙이기
      - name: Add Release Tag to ECR Image
        if: inputs.environment == 'production'
        env:
          DEPLOY_TAG: ${{ env.DEPLOY_TAG }}
          IMAGE_URI: ${{ inputs.image_uri }}
        run: |
          echo "Attaching tag $DEPLOY_TAG to Docker Image..."
          
          ECR_REPO=$(echo $IMAGE_URI | cut -d/ -f2 | cut -d: -f1)
          SHA_TAG=$(echo $IMAGE_URI | cut -d: -f2)
          
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name $ECR_REPO \
            --image-ids imageTag=$SHA_TAG \
            --query 'images[].imageManifest' \
            --output text)
            
          aws ecr put-image \
            --repository-name $ECR_REPO \
            --image-tag $DEPLOY_TAG \
            --image-manifest "$MANIFEST"
            
          echo "ECR Image tagged with $DEPLOY_TAG"

      # 3. 시작 템플릿(Launch Template) 새 버전 생성
      - name: Create New Launch Template Version
        id: update-lt
        env:
          DEPLOY_TAG: ${{ env.DEPLOY_TAG }}
        run: |
          echo "Fetching current User Data for LT ID: ${{ inputs.lt_id }}..."
          
          CURRENT_LT=$(aws ec2 describe-launch-template-versions \
            --launch-template-id ${{ inputs.lt_id }} \
            --versions "\$Latest" \
            --query 'LaunchTemplateVersions[0].LaunchTemplateData')

          CURRENT_USER_DATA_BASE64=$(echo $CURRENT_LT | jq -r '.UserData')
          CURRENT_USER_DATA=$(echo $CURRENT_USER_DATA_BASE64 | base64 --decode)

          NEW_IMAGE_URI="${{ inputs.image_uri }}"
          APP_ENV="${{ inputs.environment }}"
          S3_BUCKET_NAME="raise-developer-${{ inputs.environment }}-deploy"

          echo "Injecting Environment: $APP_ENV"

          NEW_USER_DATA=$(echo "$CURRENT_USER_DATA" | sed "s|export IMAGE_URI=.*|export IMAGE_URI=\"$NEW_IMAGE_URI\"|g")
          NEW_USER_DATA=$(echo "$NEW_USER_DATA" | sed "s|export APP_ENV=.*|export APP_ENV=\"$APP_ENV\"|g")
          NEW_USER_DATA=$(echo "$NEW_USER_DATA" | sed "s|export S3_BUCKET_NAME=.*|export S3_BUCKET_NAME=\"$S3_BUCKET_NAME\"|g")

          NEW_USER_DATA_BASE64=$(echo "$NEW_USER_DATA" | base64 -w 0)

          echo "Creating new Launch Template version..."
          
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id ${{ inputs.lt_id }} \
            --source-version "\$Latest" \
            --version-description "Release ${{ env.DEPLOY_TAG }}" \
            --launch-template-data "{\"UserData\":\"$NEW_USER_DATA_BASE64\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "Created Launch Template Version: $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      # 4. ASG 인스턴스 리프레시 시작 (Rolling Update)
      - name: Start Instance Refresh
        id: refresh
        run: |
          echo "Starting Instance Refresh for ASG: ${{ inputs.asg_name }}..."

          CURRENT_REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${{ inputs.asg_name }} \
            --query 'InstanceRefreshes[?Status==`InProgress`].InstanceRefreshId' \
            --output text)
            
          if [ ! -z "$CURRENT_REFRESH_ID" ] && [ "$CURRENT_REFRESH_ID" != "None" ]; then
            echo "Found in-progress refresh ($CURRENT_REFRESH_ID). Cancelling it now..."
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name ${{ inputs.asg_name }}
            echo "Waiting for cancellation..."
            sleep 10
          fi
          
          if [ "${{ inputs.environment }}" == "production" ]; then
            MIN_HEALTHY=50
          else
            MIN_HEALTHY=0
          fi
          
          echo "Using MinHealthyPercentage: $MIN_HEALTHY"

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ inputs.asg_name }} \
            --preferences "{\"MinHealthyPercentage\": $MIN_HEALTHY, \"InstanceWarmup\": 180, \"AutoRollback\": true}" \
            --desired-configuration "{\"LaunchTemplate\":{\"LaunchTemplateId\":\"${{ inputs.lt_id }}\",\"Version\":\"${{ steps.update-lt.outputs.VERSION }}\"}}" \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_OUTPUT

      # 5. 배포 완료 대기 (Polling)
      - name: Wait for Instance Refresh
        id: wait-refresh
        timeout-minutes: 10
        run: |
          echo "Waiting for Instance Refresh to complete..."
          REFRESH_ID=${{ steps.refresh.outputs.REFRESH_ID }}
          ASG_NAME=${{ inputs.asg_name }}
          
          while :; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name $ASG_NAME \
              --instance-refresh-ids $REFRESH_ID \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            
            echo "Current Status: $STATUS"

            if [[ "$STATUS" == "Successful" ]]; then
              echo "Instance Refresh Completed Successfully!"
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "Instance Refresh Failed!"
              aws autoscaling describe-instance-refreshes --auto-scaling-group-name $ASG_NAME --instance-refresh-ids $REFRESH_ID
              exit 1
            elif [[ "$STATUS" == "RollbackSuccessful" ]]; then
               echo "Deployment Failed but Auto-Rollback Succeeded!"
               exit 1
            elif [[ "$STATUS" == "RollbackFailed" ]]; then
               echo "Deployment Failed AND Auto-Rollback Failed!"
               exit 1
            fi

            echo "Waiting 10s..."
            sleep 10
          done

      # 6. 성공 시 ASG 설정을 최신 버전으로 확정
      - name: Update ASG Configuration to New Version
        if: success()
        run: |
          echo "Updating ASG to use Version ${{ steps.update-lt.outputs.VERSION }}..."
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name ${{ inputs.asg_name }} \
            --launch-template "LaunchTemplateId=${{ inputs.lt_id }},Version=${{ steps.update-lt.outputs.VERSION }}"
          echo "ASG Default Version Updated!"

      # 7. SSM을 이용한 프라이빗 내부망 헬스체크
      - name: Internal Health Check Verification (via SSM)
        if: success()
        run: |
          echo "Checking actual service health from inside the VPC via SSM..."
          ASG_NAME=${{ inputs.asg_name }}
          
          # 1. 방금 ASG에 의해 띄워진 정상(InService) 인스턴스 ID 하나 가져오기
          INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names $ASG_NAME \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text | awk '{print $1}')
            
          if [ -z "$INSTANCE_ID" ]; then
            echo "No InService instances found to run health check."
            exit 1
          fi

          echo "Found instance $INSTANCE_ID. Sending SSM command..."
          
          # 2. 인스턴스 내부 요원에게 자가 진단(localhost:8000/health) 명령 하달!
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["curl -s -f http://localhost:8000/api/v1/health || exit 1"]' \
            --query "Command.CommandId" \
            --output text)
            
          echo "Waiting for internal health check to complete..."
          sleep 10
          
          # 3. 결과 확인
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)
            
          if [[ "$STATUS" == "Success" ]]; then
            echo "Internal Health Check Passed! Real Success!"
          else
            echo "Internal Health Check Failed! ASG False-Positive Detected!"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
            exit 1
          fi

      - name: Verify Running Launch Template Version
        if: success()
        run: |
          ASG_NAME=${{ inputs.asg_name }}
          NEW_VERSION=${{ steps.update-lt.outputs.VERSION }}
          
          echo "Verifying if running instances are using Launch Template Version: $NEW_VERSION..."
          
          RUNNING_VERSIONS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names $ASG_NAME \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].LaunchTemplate.Version' \
            --output text)
          
          echo "Detected Running Versions: $RUNNING_VERSIONS"
          
          for v in $RUNNING_VERSIONS; do
            if [ "$v" != "$NEW_VERSION" ]; then
              echo "Mismatch Detected! Instance is running version $v, but expected $NEW_VERSION"
              exit 1
            fi
          done
          
          echo "All instances are running the correct version."

      # 현재 시간 구하기 (KST)
      - name: Get Current Time
        if: always()
        uses: 1466587594/get-current-time@v2
        id: current-time
        with:
          format: 'YYYY-MM-DD HH:mm:ss'
          utcOffset: "+09:00" 
          timezone: 'Asia/Seoul'

      # 성공 알림
      - name: Discord Notification - Success
        if: success()
        env:
          DEPLOY_TAG: ${{ env.DEPLOY_TAG }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "✅ ${{ inputs.environment }} AI 배포(CD) 성공",
              "color": 5763719,
              "fields": [
                {"name": "Repository", "value": "${{ inputs.repository }}", "inline": false},
                {"name": "Environment", "value": "${{ inputs.environment }}", "inline": true},
                {"name": "Merge To", "value": "${{ inputs.base_ref }}", "inline": true},
                {"name": "Triggered By", "value": "${{ inputs.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ inputs.pr_title }}", "inline": false},
                {"name": "Version", "value": "${{ env.DEPLOY_TAG || 'N/A' }}", "inline": true},
                {"name": "Actions Log", "value": "[Link](${{ github.server_url }}/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: 'v2 ${{ inputs.environment }} AI 배포 완료! <@&${{ secrets.DISCORD_ROLE_AI }}>'

      # 실패 알림
      - name: Discord Notification - Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "🚨 ${{ inputs.environment }} AI 배포(CD) 실패",
              "color": 15548997,
              "fields": [
                  {"name": "Repository", "value": "${{ inputs.repository }}", "inline": false},
                  {"name": "Environment", "value": "${{ inputs.environment }}", "inline": true},
                  {"name": "Merge To", "value": "${{ inputs.base_ref }}", "inline": true},
                  {"name": "Triggered By", "value": "${{ inputs.actor }}", "inline": false},
                  {"name": "Commit/PR", "value": "${{ inputs.pr_title }}", "inline": false},
                  {"name": "Actions Log", "value": "[Link to Action](${{ github.server_url }}/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: 'v2 ${{ inputs.environment }} AI 배포 실패! 로그 확인 필요. <@&${{ secrets.DISCORD_ROLE_AI_ONCALL }}>'
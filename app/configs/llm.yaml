default_provider: ollama_cloud

providers:

  openai:
    spec: openai_compatible
    auth: api_key
    base_url: https://api.openai.com/v1
    model: gpt-4.1-mini
    timeout_sec: 40
    max_tries: 1

  ollama_cloud:
    spec: openai_compatible
    auth: api_key
    base_url: https://ollama.com
    model: gpt-oss:120b-cloud
    timeout_sec: 40
    max_tries: 1

  gemini:
    spec: gemini_native
    auth: api_key
    model: gemini-2.5-flash
    timeout_sec: 40
    max_tries: 1

  self_hosted:
    spec: openai_compatible
    auth: none
    base_url:
    model: gemma3:12b
    timeout_sec: 40
    max_tries: 1

fallback: true

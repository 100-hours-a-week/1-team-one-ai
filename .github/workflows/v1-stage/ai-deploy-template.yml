name: AI Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        description: '배포 환경 (dev, staging, production)'
        required: true
        type: string
      pr_number:
        description: 'PR 번호'
        required: true
        type: number
      commit_sha:
        description: '커밋 SHA'
        required: true
        type: string
      base_ref:
        description: '베이스 브랜치 (main, develop)'
        required: true
        type: string
      pr_title:
        description: 'PR 제목'
        required: true
        type: string
      actor:
        description: 'Triggered by (GitHub 사용자)'
        required: true
        type: string
      repository:
        description: 'Repository 이름'
        required: true
        type: string
      run_id:
        description: 'GitHub Actions Run ID'
        required: true
        type: string
      create_tag:
        description: '시맨틱 버전 태그 생성 여부 (production만 true)'
        required: false
        type: boolean
        default: false
    secrets:
      SERVER_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      DISCORD_WEBHOOK_URL:
        required: true
      DISCORD_ROLE_AI:
        required: true
      DISCORD_ROLE_AI_ONCALL:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ inputs.environment }}
    steps:
      # 1. 코드 체크아웃 (태깅용)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git Tag 생성 위해 전체 히스토리 필요함

      # 2. Artifact Download
      - name: Download Zip artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ai-ci-cd.yml # Artifact를 생성한 워크플로우 파일명
          pr: ${{ inputs.pr_number }} # PR 번호로 검색
          workflow_conclusion: success # 성공한 워크플로우만 검색
          name_is_regexp: true # Artifact 이름을 정규표현식으로 검색
          name: "ai-app-.*"
          path: ./artifacts

      # 3. 타임스탬프로 ZIP 파일명 변경
      - name: Prepare Zip with timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          cd artifacts
          cd $(ls -d ai-app-* | head -n 1)
          ZIP_FILE=$(ls *.zip | head -n 1)
          mv $ZIP_FILE ../../ai-app-${TIMESTAMP}.zip
          cd ../..
          echo "ZIP_FILENAME=ai-app-${TIMESTAMP}.zip" >> $GITHUB_ENV
          echo "DEPLOY_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      # 4. release/ 디렉토리로 ZIP 전송
      - name: Transfer Zip to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "ai-app-${{ env.DEPLOY_TIMESTAMP }}.zip" # 전송할 파일
          target: "~/ai/release/"
          strip_components: 0

      # 5. 배포 실행 (심볼릭 링크 방식)
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_DIR="/home/ubuntu/ai"
            RELEASE_DIR="$PROJECT_DIR/release"
            NEW_RELEASE_DIR="$RELEASE_DIR/${{ env.DEPLOY_TIMESTAMP }}"
            ZIP_FILE="$RELEASE_DIR/ai-app-${{ env.DEPLOY_TIMESTAMP }}.zip"
            CURRENT_LINK="$PROJECT_DIR/current"
            
            echo "1. 압축 해제"
            mkdir -p $NEW_RELEASE_DIR
            unzip -q $ZIP_FILE -d $NEW_RELEASE_DIR
            
            echo "2. 의존성 업데이트 (서버 환경에 맞게 설치)"
            # 서버에는 미리 venv가 만들어져 있다고 가정 (/home/ubuntu/ai/venv)
            source $PROJECT_DIR/venv/bin/activate
            
            # uv를 사용하여 설치 (서버에도 uv 설치)
            # 여기서는 운영 환경이므로 GPU 버전을 설치해야 한다면 requirements.txt 설정 따름
            python3.11 -m pip install uv

            python3.11 -m uv cache clean

            python3.11 -m uv pip install \
              --index-strategy unsafe-best-match \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -r $NEW_RELEASE_DIR/requirements.txt

            echo "3. 심볼릭 링크 교체"
            ln -sfn $NEW_RELEASE_DIR $CURRENT_LINK
            
            echo "4. 서비스 재시작"
            # systemd 서비스 파일은 ExecStart=$PROJECT_DIR/venv/bin/uvicorn ... $PROJECT_DIR/current/main:app 형태여야 함
            sudo systemctl restart ai-service
            
            echo "5. 상태 확인"
            sudo systemctl status ai-service --no-pager
            sleep 10

      # 6. Health Check (Port 8000)
      - name: Health Check
        id: healthcheck
        uses: appleboy/ssh-action@v1.0.0
        # continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "6. Health Check"
            MAX_RETRY=10
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRY ]; do
              if curl -f -s http://localhost:8000/api/v1/health > /dev/null; then
                echo "Health check passed!"
                exit 0
              fi
            
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "Retry $RETRY_COUNT/$MAX_RETRY..."
              sleep 10
            done
            
            echo "Health check failed!"
            # 로그를 출력하고 비정상 종료
            journalctl -u ai-service -n 30 --no-pager
            exit 1

      # 7. 시맨틱 버저닝
      - name: Create Semantic Version Tag
        if: |
          steps.healthcheck.outcome == 'success' && inputs.create_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "ai-v*.*.*" 2>/dev/null || echo "ai-v0.0.0")
          VERSION=${LATEST_TAG#ai-v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEW_VERSION="ai-v${MAJOR}.${MINOR}.${PATCH}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $NEW_VERSION -m "AI Release $NEW_VERSION"
          git push origin $NEW_VERSION
          
          echo "DEPLOY_TAG=$NEW_VERSION" >> $GITHUB_ENV

      # 8. 오래된 배포 정리 (폴더 정리)
      - name: Cleanup Old Releases
        if: steps.healthcheck.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/ai/release
            # 날짜순 정렬 후 최신 5개 제외하고 삭제 (폴더 기준)
            ls -dt 20* | tail -n +6 | xargs -r rm -rf
            # zip 파일도 정리
            ls -t ai-app-*.zip | tail -n +6 | xargs -r rm -v

      # 현재 시간 구하기 (KST)
      - name: Get Current Time
        if: always()
        uses: 1466587594/get-current-time@v2
        id: current-time
        with:
          format: 'YYYY-MM-DD HH:mm:ss'
          utcOffset: "+09:00" # 한국 시간
          timezone: 'Asia/Seoul'

      # 9. Discord 성공 알림
      - name: Discord Notification - Success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "✅ ${{ inputs.environment }} AI 배포(CD) 성공", 
              "color": 5763719,
              "fields": [
                {"name": "Repository", "value": "${{ inputs.repository }}", "inline": false},
                {"name": "Environment", "value": "${{ inputs.environment }}", "inline": true},
                {"name": "Merge To", "value": "${{ inputs.base_ref }}", "inline": true},
                {"name": "Triggered By", "value": "${{ inputs.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ inputs.pr_title }}", "inline": false},
                {"name": "Version", "value": "${{ env.DEPLOY_TAG || 'N/A' }}", "inline": true},
                {"name": "Actions Log", "value": "[Link to Action](https://github.com/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: '${{ inputs.environment }} 배포 완료! <@&${{ secrets.DISCORD_ROLE_AI }}>'

      # 10. Discord 실패 알림
      - name: Discord Notification - Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "🚨 ${{ inputs.environment }} AI 배포(CD) 실패",
              "color": 15548997,
              "fields": [
                {"name": "Repository", "value": "${{ inputs.repository }}", "inline": false},
                {"name": "Environment", "value": "${{ inputs.environment }}", "inline": true},
                {"name": "Merge To", "value": "${{ inputs.base_ref }}", "inline": true},
                {"name": "Triggered By", "value": "${{ inputs.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ inputs.pr_title }}", "inline": false},
                {"name": "Actions Log", "value": "[Link to Action](https://github.com/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: '${{ inputs.environment }} 배포 실패! 로그 확인 필요 <@&${{ secrets.DISCORD_ROLE_AI_ONCALL }}>'
